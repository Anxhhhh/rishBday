<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="100%" height="100%">
  <defs>
    <filter id="giftBoxShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4c0519" flood-opacity="0.3" />
    </filter>
    <!-- Red Box Gradients -->
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <!-- Gold Ribbon Gradients -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="75%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="goldBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>

  <g filter="url(#giftBoxShadow)">
    <!-- 3D Perspective Cube Box -->
    <!-- Front Face -->
    <polygon points="120,110 215,80 215,220 120,250" fill="url(#boxFront)" />
    <!-- Left Face -->
    <polygon points="25,80 120,110 120,250 25,220" fill="url(#boxLeft)" />
    
    <!-- Top Face / Lid -->
    <polygon points="120,60 215,80 120,105 25,80" fill="url(#boxTop)" />

    <!-- Lid Overhang Trim -->
    <polygon points="25,80 120,105 120,120 25,95" fill="#9f1239" opacity="0.6" />
    <polygon points="120,105 215,80 215,95 120,120" fill="#881337" opacity="0.6" />

    <!-- Gold Ribbon Bands -->
    <!-- Front vertical ribbon -->
    <polygon points="160,97 175,93 175,232 160,237" fill="url(#goldRibbon)" stroke="#a16207" stroke-width="0.8" />
    <!-- Left vertical ribbon -->
    <polygon points="65,92 80,97 80,237 65,232" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="0.8" />
    <!-- Top diagonal ribbons crossing -->
    <polygon points="65,71 80,68 175,93 160,97" fill="url(#goldRibbon)" />
    <polygon points="160,68 175,71 80,97 65,93" fill="url(#goldRibbon)" />

    <!-- Shiny Satin Gold Bow on Top -->
    <!-- Left bow loop -->
    <path d="M 120,80 C 85,35 45,55 75,75 C 95,85 115,82 120,80 Z" fill="url(#goldBow)" stroke="#a16207" stroke-width="1.2" />
    <path d="M 115,78 C 88,48 60,60 80,73" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.8" />
    <!-- Right bow loop -->
    <path d="M 120,80 C 155,35 195,55 165,75 C 145,85 125,82 120,80 Z" fill="url(#goldBow)" stroke="#a16207" stroke-width="1.2" />
    <path d="M 125,78 C 152,48 180,60 160,73" stroke="#fef08a" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Upper loop left -->
    <path d="M 120,78 C 95,45 80,30 105,40 C 120,50 120,72 120,78 Z" fill="url(#goldBow)" stroke="#a16207" stroke-width="1" />
    <!-- Upper loop right -->
    <path d="M 120,78 C 145,45 160,30 135,40 C 120,50 120,72 120,78 Z" fill="url(#goldBow)" stroke="#a16207" stroke-width="1" />

    <!-- Center Knot -->
    <ellipse cx="120" cy="78" rx="14" ry="11" fill="url(#goldBow)" stroke="#a16207" stroke-width="1.5" />
    <ellipse cx="118" cy="76" rx="6" ry="4" fill="#ffffff" opacity="0.75" />

    <!-- Ribbon Tails -->
    <path d="M 112,85 Q 90,115 70,125 Q 85,110 110,90 Z" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="0.8" />
    <path d="M 128,85 Q 150,115 170,125 Q 155,110 130,90 Z" fill="url(#goldRibbon)" stroke="#854d0e" stroke-width="0.8" />
  </g>
</svg>
