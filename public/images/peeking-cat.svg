<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Cat Ears & Head Outline -->
    <!-- Left Ear -->
    <path d="M 68 85 L 56 34 C 54 26 62 20 68 25 L 94 48" fill="#ffffff" stroke="#2b1f40" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Left Inner Ear -->
    <path d="M 64 36 L 73 54 L 86 52 Z" fill="#e9d5ff" />

    <!-- Right Ear -->
    <path d="M 146 48 L 172 25 C 178 20 186 26 184 34 L 172 85" fill="#ffffff" stroke="#2b1f40" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Right Inner Ear -->
    <path d="M 176 36 L 167 54 L 154 52 Z" fill="#e9d5ff" />

    <!-- Cat Head Shape -->
    <path d="M 56 70 C 44 95 56 135 120 135 C 184 135 196 95 184 70 C 175 48 145 42 120 42 C 95 42 65 48 56 70 Z" fill="#ffffff" stroke="#2b1f40" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Cat Eyes -->
    <circle cx="95" cy="88" r="6" fill="#2b1f40" />
    <circle cx="145" cy="88" r="6" fill="#2b1f40" />
    <!-- Eye Highlights -->
    <circle cx="93.5" cy="86.5" r="1.8" fill="#ffffff" />
    <circle cx="143.5" cy="86.5" r="1.8" fill="#ffffff" />

    <!-- Cat Nose -->
    <ellipse cx="120" cy="94" rx="3.5" ry="2.5" fill="#2b1f40" />

    <!-- Cat Mouth -->
    <path d="M 113 97 Q 120 101 120 96 Q 120 101 127 97" stroke="#2b1f40" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Whiskers Left -->
    <line x1="72" y1="84" x2="52" y2="82" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />
    <line x1="72" y1="90" x2="50" y2="92" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />
    <line x1="74" y1="96" x2="54" y2="102" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />

    <!-- Whiskers Right -->
    <line x1="168" y1="84" x2="188" y2="82" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />
    <line x1="168" y1="90" x2="190" y2="92" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />
    <line x1="166" y1="96" x2="186" y2="102" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="82" cy="95" r="6" fill="#fbcfe8" opacity="0.6" />
    <circle cx="158" cy="95" r="6" fill="#fbcfe8" opacity="0.6" />

    <!-- Left Paw (resting on the card rim) -->
    <ellipse cx="88" cy="138" rx="16" ry="11" fill="#ffffff" stroke="#2b1f40" stroke-width="4" />
    <line x1="84" y1="135" x2="84" y2="145" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />
    <line x1="92" y1="135" x2="92" y2="145" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />

    <!-- Right Paw (resting on the card rim) -->
    <ellipse cx="152" cy="138" rx="16" ry="11" fill="#ffffff" stroke="#2b1f40" stroke-width="4" />
    <line x1="148" y1="135" x2="148" y2="145" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />
    <line x1="156" y1="135" x2="156" y2="145" stroke="#2b1f40" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

