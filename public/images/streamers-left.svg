<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 360" width="100%" height="100%">
  <!-- Left Cascading Streamers -->
  <!-- Streamer 1: Crimson Red Spiral -->
  <path d="M 20,0 
           Q 45,30 20,60 Q -5,90 20,120 Q 45,150 20,180 Q -5,210 20,240 Q 45,270 20,300 Q -5,330 20,360" 
        stroke="#dc2626" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
  
  <!-- Streamer 2: Golden Yellow Spiral -->
  <path d="M 50,0 
           Q 15,35 50,70 Q 85,105 50,140 Q 15,175 50,210 Q 85,245 50,280 Q 15,315 50,350" 
        stroke="#eab308" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Streamer 3: Purple Spiral -->
  <path d="M 80,0 
           Q 60,40 80,80 Q 100,120 80,160 Q 60,200 80,240 Q 100,280 80,320" 
        stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8" />
</svg>

