<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <radialGradient id="silverFoilGleam" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
    <linearGradient id="creaseShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g filter="url(#starShadow)">
    <!-- 4-point Foil Star Balloon Body -->
    <path d="M 60,8 C 62,35 85,58 112,60 C 85,62 62,85 60,112 C 58,85 35,62 8,60 C 35,58 58,35 60,8 Z" fill="url(#silverFoilGleam)" stroke="#94a3b8" stroke-width="2" />
    
    <!-- Crease facets for foil balloon 3D puffed effect -->
    <path d="M 60,8 L 60,112 M 8,60 L 112,60" stroke="#cbd5e1" stroke-width="1.5" opacity="0.7" />
    <path d="M 60,8 C 61,32 72,48 88,60 C 72,72 61,88 60,112" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M 8,60 C 32,59 48,48 60,32" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.75" />

    <!-- Center reflection flare -->
    <circle cx="60" cy="60" r="7" fill="#ffffff" opacity="0.85" />
    <circle cx="58" cy="58" r="3" fill="#ffffff" />
    
    <!-- Balloon tie tail -->
    <polygon points="57,112 63,112 60,118" fill="#94a3b8" />
  </g>
</svg>

