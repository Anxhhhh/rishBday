<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="50%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGrad)" />

  <!-- Confetti dots in background -->
  <circle cx="120" cy="180" r="8" fill="#fbbf24" opacity="0.8" />
  <circle cx="380" cy="190" r="9" fill="#38bdf8" opacity="0.8" />
  <circle cx="150" cy="330" r="7" fill="#f43f5e" opacity="0.7" />
  <circle cx="360" cy="320" r="8" fill="#a855f7" opacity="0.7" />
  <circle cx="250" cy="90" r="10" fill="#f59e0b" opacity="0.9" />

  <!-- Birthday Hat -->
  <polygon points="250,90 210,185 290,185" fill="url(#hatGrad)" />
  <!-- Hat stripes -->
  <path d="M 223 155 Q 250 162 277 155" stroke="#fef08a" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M 235 125 Q 250 130 265 125" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Hat pom-pom -->
  <circle cx="250" cy="90" r="12" fill="#fbbf24" />

  <!-- Head -->
  <circle cx="250" cy="245" r="70" fill="#fed7aa" />

  <!-- Hair / Silhouette -->
  <path d="M 185 240 C 185 180 315 180 315 240 C 315 200 290 190 250 190 C 210 190 185 200 185 240 Z" fill="#475569" />

  <!-- Happy Eyes -->
  <path d="M 225 242 Q 235 233 245 242" stroke="#334155" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 255 242 Q 265 233 275 242" stroke="#334155" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <circle cx="220" cy="254" r="8" fill="#fda4af" opacity="0.7" />
  <circle cx="280" cy="254" r="8" fill="#fda4af" opacity="0.7" />

  <!-- Smile -->
  <path d="M 238 258 Q 250 270 262 258" stroke="#e11d48" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Shoulders / Clothes -->
  <path d="M 160 380 C 160 305 340 305 340 380 Z" fill="#9333ea" opacity="0.85" />
  <path d="M 225 315 L 250 345 L 275 315" fill="#fdf4ff" />

  <!-- Text hint -->
  <rect x="150" y="395" width="200" height="32" rx="16" fill="#ffffff" opacity="0.9" />
  <text x="250" y="416" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">
    Add Friend's Photo
  </text>
</svg>

