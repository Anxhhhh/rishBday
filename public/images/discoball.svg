<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" width="100%" height="100%">
  <defs>
    <filter id="discoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-opacity="0.25" />
    </filter>
    <radialGradient id="discoGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
    <linearGradient id="silverFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <g filter="url(#discoGlow)">
    <!-- Hanging String -->
    <line x1="110" y1="0" x2="110" y2="25" stroke="#64748b" stroke-width="2" />

    <!-- Disco Ball Sphere -->
    <circle cx="110" cy="95" r="70" fill="url(#discoGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Grid / Tiles on Disco Ball -->
    <!-- Horizontal lines -->
    <ellipse cx="110" cy="55" rx="56" ry="12" fill="none" stroke="#64748b" stroke-width="1" opacity="0.6" />
    <ellipse cx="110" cy="75" rx="67" ry="16" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.6" />
    <ellipse cx="110" cy="95" rx="70" ry="18" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.7" />
    <ellipse cx="110" cy="115" rx="67" ry="16" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.6" />
    <ellipse cx="110" cy="135" rx="56" ry="12" fill="none" stroke="#64748b" stroke-width="1" opacity="0.6" />

    <!-- Vertical lines -->
    <path d="M 110,25 L 110,165" stroke="#64748b" stroke-width="1.2" opacity="0.7" />
    <path d="M 85,30 Q 75,95 85,160" stroke="#64748b" stroke-width="1" opacity="0.6" fill="none" />
    <path d="M 65,45 Q 52,95 65,145" stroke="#64748b" stroke-width="1" opacity="0.6" fill="none" />
    <path d="M 135,30 Q 145,95 135,160" stroke="#64748b" stroke-width="1" opacity="0.6" fill="none" />
    <path d="M 155,45 Q 168,95 155,145" stroke="#64748b" stroke-width="1" opacity="0.6" fill="none" />

    <!-- Sparkling reflection tiles -->
    <rect x="75" y="60" width="8" height="8" fill="#ffffff" opacity="0.9" rx="1" />
    <rect x="95" y="52" width="10" height="9" fill="#ffffff" opacity="0.95" rx="1" />
    <rect x="86" y="76" width="9" height="9" fill="#ffffff" opacity="0.85" rx="1" />
    <rect x="105" y="70" width="11" height="10" fill="#ffffff" opacity="0.95" rx="1" />
    <rect x="125" y="74" width="9" height="9" fill="#ffffff" opacity="0.85" rx="1" />
    <rect x="116" y="92" width="10" height="9" fill="#ffffff" opacity="0.9" rx="1" />
    <rect x="94" y="94" width="9" height="9" fill="#ffffff" opacity="0.85" rx="1" />
    <rect x="70" y="88" width="8" height="8" fill="#ffffff" opacity="0.8" rx="1" />

    <!-- Sparkle cross on ball -->
    <path d="M 105,48 L 105,62 M 98,55 L 112,55" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="105" cy="55" r="2.5" fill="#ffffff" />

    <!-- Silver Foil Star Balloon underneath -->
    <g transform="translate(145, 175)">
      <!-- 4-point metallic star balloon -->
      <path d="M 0,-40 Q 5,-10 35,0 Q 5,10 0,40 Q -5,10 -35,0 Q -5,-10 0,-40 Z" fill="url(#silverFoil)" stroke="#64748b" stroke-width="1.5" />
      <!-- Crease reflection lines on balloon -->
      <path d="M 0,-40 L 0,40 M -35,0 L 35,0" stroke="#ffffff" stroke-width="1.2" opacity="0.7" />
      <circle cx="-5" cy="-6" r="3" fill="#ffffff" opacity="0.8" />
      <!-- Balloon knot/tail -->
      <polygon points="-4,40 4,40 0,47" fill="#94a3b8" />
    </g>
  </g>
</svg>

