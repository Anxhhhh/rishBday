<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" width="100%" height="100%">
  <defs>
    <filter id="kittenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#kittenShadow)">
    <!-- Cat Body -->
    <path d="M 35,240 C 35,160 55,120 90,120 C 125,120 145,160 145,240 Z" fill="#94a3b8" stroke="#334155" stroke-width="2.5" />
    <!-- Fur stripes -->
    <path d="M 75,150 Q 90,165 105,150" stroke="#475569" stroke-width="3" fill="none" />
    <path d="M 70,175 Q 90,190 110,175" stroke="#475569" stroke-width="3" fill="none" />
    <path d="M 68,200 Q 90,215 112,200" stroke="#475569" stroke-width="3" fill="none" />

    <!-- Cat Head -->
    <circle cx="90" cy="100" r="45" fill="#94a3b8" stroke="#334155" stroke-width="2.5" />

    <!-- Cat Ears -->
    <polygon points="50,80 40,30 75,65" fill="#94a3b8" stroke="#334155" stroke-width="2.5" />
    <polygon points="48,74 44,42 66,66" fill="#fbcfe8" />
    <polygon points="130,80 140,30 105,65" fill="#94a3b8" stroke="#334155" stroke-width="2.5" />
    <polygon points="132,74 136,42 114,66" fill="#fbcfe8" />

    <!-- Striped Green Party Hat -->
    <g transform="translate(100, 20)">
      <polygon points="0,-20 -22,45 22,45" fill="#10b981" stroke="#047857" stroke-width="2" />
      <path d="M -16,28 Q 0,33 16,28" stroke="#fef08a" stroke-width="4" fill="none" />
      <path d="M -11,10 Q 0,14 11,10" stroke="#f43f5e" stroke-width="4" fill="none" />
      <path d="M -6,-5 Q 0,-2 6,-5" stroke="#38bdf8" stroke-width="3" fill="none" />
      <!-- Pom-pom -->
      <circle cx="0" cy="-22" r="6" fill="#fbbf24" />
    </g>

    <!-- Eyes (happy closed / blinking eyes) -->
    <path d="M 65,95 Q 75,85 82,95" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 98,95 Q 105,85 115,95" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Nose & Open Yawning/Meowing Mouth -->
    <polygon points="88,103 92,103 90,106" fill="#f43f5e" />
    <ellipse cx="90" cy="115" rx="8" ry="10" fill="#e11d48" />
    <path d="M 85,118 Q 90,123 95,118" fill="#fda4af" />

    <!-- Whiskers -->
    <line x1="60" y1="105" x2="40" y2="103" stroke="#334155" stroke-width="2" />
    <line x1="60" y1="112" x2="38" y2="114" stroke="#334155" stroke-width="2" />
    <line x1="120" y1="105" x2="140" y2="103" stroke="#334155" stroke-width="2" />
    <line x1="120" y1="112" x2="142" y2="114" stroke="#334155" stroke-width="2" />

    <!-- Waving Left Paw -->
    <g transform="translate(25, 140)">
      <ellipse cx="0" cy="0" rx="16" ry="22" fill="#94a3b8" stroke="#334155" stroke-width="2.5" transform="rotate(-30)" />
      <!-- Toe beans -->
      <ellipse cx="-2" cy="-8" rx="4" ry="5" fill="#fbcfe8" />
      <ellipse cx="6" cy="-6" rx="4" ry="5" fill="#fbcfe8" />
      <ellipse cx="-8" cy="-2" rx="4" ry="5" fill="#fbcfe8" />
      <circle cx="0" cy="3" r="6" fill="#fbcfe8" />
    </g>
  </g>
</svg>

