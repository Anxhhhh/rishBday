<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <filter id="balloonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#balloonShadow)">
    <!-- Balloon Strings -->
    <path d="M 50,85 Q 70,160 85,225" stroke="#ef4444" stroke-width="2" fill="none" />
    <path d="M 100,65 Q 90,150 85,225" stroke="#ef4444" stroke-width="2" fill="none" />
    <path d="M 140,85 Q 110,160 85,225" stroke="#ef4444" stroke-width="2" fill="none" />

    <!-- Balloon 1 (Blue with yellow zigzags / waves) -->
    <g transform="translate(50, 75)">
      <ellipse cx="0" cy="0" rx="34" ry="42" fill="#2563eb" />
      <!-- Wave patterns -->
      <path d="M -24,-15 Q -12,-8 0,-15 Q 12,-22 24,-15" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M -28,2 Q -14,9 0,2 Q 14,-5 28,2" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M -22,20 Q -11,27 0,20 Q 11,13 22,20" stroke="#fef08a" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Knot -->
      <polygon points="-4,42 4,42 0,48" fill="#1d4ed8" />
    </g>

    <!-- Balloon 2 (Green with white/cyan polka dots) -->
    <g transform="translate(100, 55)">
      <ellipse cx="0" cy="0" rx="34" ry="42" fill="#059669" />
      <!-- Polka dots -->
      <circle cx="-14" cy="-18" r="4.5" fill="#a7f3d0" />
      <circle cx="12" cy="-15" r="4.5" fill="#a7f3d0" />
      <circle cx="-2" cy="-2" r="5" fill="#a7f3d0" />
      <circle cx="-16" cy="14" r="4.5" fill="#a7f3d0" />
      <circle cx="14" cy="16" r="4.5" fill="#a7f3d0" />
      <!-- Knot -->
      <polygon points="-4,42 4,42 0,48" fill="#047857" />
    </g>

    <!-- Balloon 3 (Orange with dark purple stripes) -->
    <g transform="translate(140, 75)">
      <ellipse cx="0" cy="0" rx="34" ry="42" fill="#f97316" />
      <!-- Stripes -->
      <path d="M -24,-14 Q 0,-6 24,-14" stroke="#4c1d95" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <path d="M -28,4 Q 0,12 28,4" stroke="#4c1d95" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <path d="M -22,22 Q 0,29 22,22" stroke="#4c1d95" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <!-- Knot -->
      <polygon points="-4,42 4,42 0,48" fill="#ea580c" />
    </g>

    <!-- Vintage Halftone Cat Bust holding the strings -->
    <g transform="translate(15, 190)">
      <!-- Cat body silhouette with halftone beige tone -->
      <path d="M 0,120 C 0,80 30,55 55,50 C 65,30 85,25 95,45 C 105,45 115,55 120,70 C 135,75 145,100 145,120 Z" fill="#f5ede0" stroke="#262626" stroke-width="2.5" />
      
      <!-- Cat Ear Left -->
      <polygon points="45,55 55,20 75,48" fill="#e8dac5" stroke="#262626" stroke-width="2.5" />
      <!-- Cat Ear Right -->
      <polygon points="90,48 110,22 118,58" fill="#e8dac5" stroke="#262626" stroke-width="2.5" />
      
      <!-- Halftone pattern dots -->
      <circle cx="50" cy="70" r="1.5" fill="#404040" />
      <circle cx="60" cy="70" r="1.5" fill="#404040" />
      <circle cx="70" cy="70" r="1.5" fill="#404040" />
      <circle cx="80" cy="70" r="1.5" fill="#404040" />
      <circle cx="90" cy="70" r="1.5" fill="#404040" />
      <circle cx="55" cy="80" r="1.5" fill="#404040" />
      <circle cx="65" cy="80" r="1.5" fill="#404040" />
      <circle cx="75" cy="80" r="1.5" fill="#404040" />
      <circle cx="85" cy="80" r="1.5" fill="#404040" />

      <!-- Eyes -->
      <ellipse cx="65" cy="65" rx="5" ry="7" fill="#171717" />
      <ellipse cx="95" cy="65" rx="5" ry="7" fill="#171717" />
      <circle cx="63.5" cy="63" r="1.8" fill="#ffffff" />
      <circle cx="93.5" cy="63" r="1.8" fill="#ffffff" />

      <!-- Nose & Mouth -->
      <polygon points="78,74 82,74 80,77" fill="#171717" />
      <path d="M 75,79 Q 80,83 80,78 Q 80,83 85,79" stroke="#171717" stroke-width="2" fill="none" stroke-linecap="round" />

      <!-- Whiskers -->
      <line x1="50" y1="72" x2="30" y2="70" stroke="#171717" stroke-width="1.8" />
      <line x1="50" y1="78" x2="30" y2="80" stroke="#171717" stroke-width="1.8" />
      <line x1="110" y1="72" x2="130" y2="70" stroke="#171717" stroke-width="1.8" />
      <line x1="110" y1="78" x2="130" y2="80" stroke="#171717" stroke-width="1.8" />

      <!-- Raised Paw holding strings -->
      <ellipse cx="70" cy="35" rx="14" ry="18" fill="#f5ede0" stroke="#262626" stroke-width="2.5" transform="rotate(-20 70 35)" />
      <circle cx="65" cy="28" r="3" fill="#e8dac5" />
      <circle cx="72" cy="26" r="3" fill="#e8dac5" />
      <circle cx="79" cy="30" r="3" fill="#e8dac5" />
    </g>
  </g>
</svg>

