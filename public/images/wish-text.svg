<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;display=swap');
      .wish-text {
        font-family: 'Alex Brush', cursive, serif;
        font-size: 92px;
        fill: #66469b;
        letter-spacing: 2px;
      }
    </style>
    <!-- Arched baseline path for text -->
    <path id="textArcPath" d="M 60,190 Q 450,30 840,190" fill="none" />
  </defs>

  <!-- Arched underline curve directly below the letters -->
  <path d="M 80,205 Q 450,48 820,205" fill="none" stroke="#66469b" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

  <!-- Arched cursive calligraphy text -->
  <text class="wish-text">
    <textPath href="#textArcPath" startOffset="50%" textAnchor="middle">
      blow and make a wish
    </textPath>
  </text>
</svg>

