<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <radialGradient id="balloonRose" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fda4af" />
      <stop offset="85%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>
    <radialGradient id="balloonLilac" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#d8b4fe" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </radialGradient>
    <radialGradient id="balloonMint" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#6ee7b7" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <radialGradient id="starSilver" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
  </defs>

  <g filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))">
    <!-- Strings -->
    <path d="M 65,115 Q 50,175 115,240 T 112,310" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 120,70 Q 135,160 115,240 T 115,310" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 180,105 Q 195,175 118,240 T 116,310" stroke="#10b981" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 130,145 Q 140,195 116,240 T 114,310" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.75" />

    <!-- Ribbon knot bow -->
    <ellipse cx="116" cy="240" rx="14" ry="7" fill="#c084fc" />
    <circle cx="116" cy="240" r="4" fill="#9333ea" />

    <!-- Balloon 1 (Mint, Back Left) -->
    <g>
      <path d="M 65,110 C 20,110 20,45 65,45 C 110,45 110,110 65,110 Z" fill="url(#balloonMint)" />
      <polygon points="61,110 69,110 65,117" fill="#059669" />
      <ellipse cx="50" cy="60" rx="8" ry="14" transform="rotate(-30 50 60)" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Balloon 2 (Rose Pink, Back Right) -->
    <g>
      <path d="M 180,100 C 135,100 135,35 180,35 C 225,35 225,100 180,100 Z" fill="url(#balloonRose)" />
      <polygon points="176,100 184,100 180,107" fill="#e11d48" />
      <ellipse cx="165" cy="50" rx="8" ry="14" transform="rotate(-30 165 50)" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Balloon 3 (Lilac Purple, Front Right) -->
    <g>
      <path d="M 135,145 C 85,145 85,70 135,70 C 185,70 185,145 135,145 Z" fill="url(#balloonLilac)" />
      <polygon points="131,145 139,145 135,153" fill="#9333ea" />
      <ellipse cx="118" cy="90" rx="9" ry="16" transform="rotate(-25 118 90)" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Foil Star Balloon (Silver Metallic) -->
    <g transform="translate(110, 60) scale(0.95) translate(-50, -50)">
      <polygon points="50,5 63,35 95,38 71,60 78,92 50,75 22,92 29,60 5,38 37,35" fill="url(#starSilver)" stroke="#ffffff" stroke-width="1.5" />
      <polygon points="50,14 59,38 84,40 65,58 70,82 50,69 30,82 35,58 16,40 41,38" fill="#ffffff" opacity="0.35" />
      <circle cx="50" cy="50" r="3" fill="#ffffff" opacity="0.8" />
    </g>
  </g>
</svg>

