<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 360" width="100%" height="100%">
  <!-- Right Cascading Streamers -->
  <!-- Streamer 1: Pink Spiral -->
  <path d="M 80,0 
           Q 55,30 80,60 Q 105,90 80,120 Q 55,150 80,180 Q 105,210 80,240 Q 55,270 80,300 Q 105,330 80,360" 
        stroke="#ec4899" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.85" />
  
  <!-- Streamer 2: Sky Blue Spiral -->
  <path d="M 50,0 
           Q 85,35 50,70 Q 15,105 50,140 Q 85,175 50,210 Q 15,245 50,280 Q 85,315 50,350" 
        stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Streamer 3: Lime/Gold Spiral -->
  <path d="M 20,0 
           Q 40,40 20,80 Q 0,120 20,160 Q 40,200 20,240 Q 0,280 20,320" 
        stroke="#eab308" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8" />
</svg>

