<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <!-- Balloon gradients -->
    <radialGradient id="balloonPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f472b6" />
      <stop offset="85%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </radialGradient>
    <radialGradient id="balloonPurple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </radialGradient>
    <radialGradient id="balloonYellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
    <radialGradient id="balloonCyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#67e8f9" />
      <stop offset="85%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </radialGradient>
    <radialGradient id="starGold" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="90%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </radialGradient>
  </defs>

  <g filter="drop-shadow(0 6px 12px rgba(0,0,0,0.15))">
    <!-- Balloon Strings -->
    <path d="M 60,110 Q 50,170 120,240 T 130,310" stroke="#f472b6" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 125,75 Q 140,160 125,240 T 128,310" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 175,115 Q 190,180 130,240 T 126,310" stroke="#06b6d4" stroke-width="2" fill="none" opacity="0.75" />
    <path d="M 110,145 Q 100,195 125,240 T 129,310" stroke="#eab308" stroke-width="2" fill="none" opacity="0.75" />

    <!-- Ribbon knot bow -->
    <ellipse cx="125" cy="240" rx="14" ry="7" fill="#fb7185" />
    <circle cx="125" cy="240" r="4" fill="#f43f5e" />

    <!-- Balloon 1 (Purple, Back Left) -->
    <g>
      <path d="M 60,105 C 15,105 15,40 60,40 C 105,40 105,105 60,105 Z" fill="url(#balloonPurple)" />
      <polygon points="56,105 64,105 60,112" fill="#9333ea" />
      <!-- Specular shine -->
      <ellipse cx="45" cy="55" rx="8" ry="14" transform="rotate(-30 45 55)" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Balloon 2 (Cyan, Back Right) -->
    <g>
      <path d="M 175,110 C 130,110 130,45 175,45 C 220,45 220,110 175,110 Z" fill="url(#balloonCyan)" />
      <polygon points="171,110 179,110 175,117" fill="#0891b2" />
      <ellipse cx="160" cy="60" rx="8" ry="14" transform="rotate(-30 160 60)" fill="#ffffff" opacity="0.5" />
    </g>

    <!-- Balloon 3 (Pink, Front Left) -->
    <g>
      <path d="M 100,150 C 50,150 50,75 100,75 C 150,75 150,150 100,150 Z" fill="url(#balloonPink)" />
      <polygon points="96,150 104,150 100,158" fill="#db2777" />
      <ellipse cx="82" cy="95" rx="9" ry="16" transform="rotate(-25 82 95)" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Foil Star Balloon (Top Center Floating Above) -->
    <g transform="translate(125, 65) scale(0.95) translate(-50, -50)">
      <polygon points="50,5 63,35 95,38 71,60 78,92 50,75 22,92 29,60 5,38 37,35" fill="url(#starGold)" stroke="#fef08a" stroke-width="1.5" />
      <polygon points="50,14 59,38 84,40 65,58 70,82 50,69 30,82 35,58 16,40 41,38" fill="#ffffff" opacity="0.25" />
      <circle cx="50" cy="50" r="3" fill="#ffffff" opacity="0.7" />
    </g>
  </g>
</svg>

